# НЕ перевірено (немає Docker на машині розробки).
services:
  worker:
    build: .
    command: python scripts/live_worker.py
    env_file: .env
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "scripts/live_worker.py", "--health"]
      interval: 60s
      timeout: 20s
      retries: 3
    restart: unless-stopped
